# Heap contenido: la máquina no tiene pagefile, el commit disponible es escaso.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.code.style=official
# Compilar Kotlin dentro del daemon de Gradle: evita un segundo JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
